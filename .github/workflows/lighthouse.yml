name: Lighthouse CI

on:
  pull_request:
    branches:
      - master # or "master", depending on your repo

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm install
      - run: npm run build
      - run: npx lhci autorun
